<svg xmlns="http://www.w3.org/2000/svg" width="460" height="170" viewBox="0 0 460 170" role="img" aria-label="Top programming languages">
  
    <style>
      .bg { fill: #0d1117; stroke: #30363d; }
      .title { fill: #58a6ff; font-family: 'JetBrains Mono', 'Consolas', 'Menlo', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
      .hero { fill: #f0f6fc; font-family: 'JetBrains Mono', 'Consolas', 'Menlo', monospace; font-size: 26px; font-weight: 800; }
      .label { fill: #8b949e; font-family: 'JetBrains Mono', 'Consolas', 'Menlo', monospace; font-size: 10px; }
      .subtext { fill: #7d8590; font-family: 'JetBrains Mono', 'Consolas', 'Menlo', monospace; font-size: 11px; }
      .bar-active { fill: #388bfd; }
      .bar-max { fill: #39d353; }
      .bar-zero { fill: #21262d; }
      .ascii-text { font-family: 'JetBrains Mono', 'Consolas', 'Menlo', monospace; font-size: 11px; fill: #8b949e; }
      .ascii-hi { fill: #39d353; font-weight: bold; }
      .ascii-med { fill: #58a6ff; }
      .ascii-low { fill: #484f58; }
      .rule { stroke: #30363d; stroke-width: 1; }

      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; stroke: #d0d7de; }
        .title { fill: #0969da; }
        .hero { fill: #1f2328; }
        .label { fill: #656d76; }
        .subtext { fill: #656d76; }
        .bar-active { fill: #0969da; }
        .bar-max { fill: #1a7f37; }
        .bar-zero { fill: #eaeef2; }
        .ascii-text { fill: #656d76; }
        .ascii-hi { fill: #1a7f37; }
        .ascii-med { fill: #0969da; }
        .ascii-low { fill: #d0d7de; }
        .rule { stroke: #d0d7de; }
      }
    </style>
    
  <rect x="0.5" y="0.5" width="459" height="169" rx="8" class="bg"/>
  <text x="24" y="32" class="title">// WORKSPACE · REPOSITORY COMPOSITION</text>

  <g id="progress-bar" clip-path="url(#bar-clip)">
    <clipPath id="bar-clip">
      <rect x="24" y="60" width="412" height="10" rx="5"/>
    </clipPath>
    <rect x="24.0" y="60" width="176.4" height="10" fill="#f34b7d"/><rect x="200.4" y="60" width="156.0" height="10" fill="#3572A5"/><rect x="356.4" y="60" width="37.9" height="10" fill="#f1e05a"/><rect x="394.3" y="60" width="34.2" height="10" fill="#555555"/><rect x="428.5" y="60" width="7.5" height="10" fill="#8b949e"/>
  </g>

  <g id="legend">
    <circle cx="28" cy="92" r="4" fill="#f34b7d"/><text x="40" y="96" class="ascii-text">C++ <tspan class="label">(42.8%)</tspan></text><circle cx="28" cy="112" r="4" fill="#3572A5"/><text x="40" y="116" class="ascii-text">Python <tspan class="label">(37.9%)</tspan></text><circle cx="28" cy="132" r="4" fill="#f1e05a"/><text x="40" y="136" class="ascii-text">JavaScript <tspan class="label">(9.2%)</tspan></text><circle cx="230" cy="92" r="4" fill="#555555"/><text x="242" y="96" class="ascii-text">C <tspan class="label">(8.3%)</tspan></text><circle cx="230" cy="112" r="4" fill="#8b949e"/><text x="242" y="116" class="ascii-text">M4 <tspan class="label">(1.8%)</tspan></text>
  </g>
</svg>